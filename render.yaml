# Keep Blueprint Auto Sync disabled until the existing web services are
# renamed in the Render Dashboard. Then manually sync this Blueprint.
databases:
  - name: balance-vault-db
    databaseName: balance_vault
    user: balance_vault
    plan: free
    region: oregon

services:
  - type: web
    name: vaultwise-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: VaultWise
      - key: DATABASE_URL
        fromDatabase:
          name: balance-vault-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://vaultwise-frontend.onrender.com

  - type: web
    name: vaultwise-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://vaultwise-api.onrender.com
