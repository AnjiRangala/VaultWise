name: Balance Vault CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerline
          POSTGRES_USER: ledgerline
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledgerline@localhost:5432/ledgerline
      BALANCE_VAULT_TEST_DATABASE_URL: postgresql+psycopg://ledgerline@localhost:5432/ledgerline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Configure isolated test signing key
        run: python -c 'import secrets; print("JWT_SECRET_KEY=" + secrets.token_urlsafe(48))' >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate formatting and lint
        run: ruff check .
      - name: Run type checking
        run: mypy
      - name: Audit dependencies
        run: python -m pip check
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Validate container build
        run: docker build --tag balance-vault:ci .
