name: LedgerLine CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledgerline
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledgerline:ledgerline_ci@localhost:5432/ledgerline
      LEDGERLINE_TEST_DATABASE_URL: postgresql+psycopg://ledgerline:ledgerline_ci@localhost:5432/ledgerline
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate formatting and lint
        run: ruff check .
      - name: Run type checking
        run: mypy
      - name: Audit dependencies
        run: python -m pip check
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Validate container build
        run: docker build --tag ledgerline:ci .
